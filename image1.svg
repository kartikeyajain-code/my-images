<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" style="background-color:#FFFFFF;">
  <style>
    .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: bold; fill: #333; }
    .header { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; fill: #1a237e; }
    .sub-header { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-style: italic; fill: #555; }
    .container { fill: #f8fbfd; stroke: #cfd8dc; stroke-width: 3; }
    .phloem { fill: #90caf9; stroke: #1e88e5; stroke-width: 2; }
    .xylem { fill: #ffcdd2; stroke: #e53935; stroke-width: 2; }
    .cambium { fill: #fff59d; stroke: #fbc02d; stroke-width: 2; }
    .arrow-line { stroke: #424242; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#424242" />
    </marker>
  </defs>

  <!-- Left Side: Conjoint Closed Vascular Bundle (Monocot) -->
  <rect x="50" y="50" width="320" height="500" rx="15" ry="15" class="container" />
  <text x="210" y="95" text-anchor="middle" class="header">Conjoint Closed Bundle</text>
  <text x="210" y="125" text-anchor="middle" class="sub-header">(Monocot Stem)</text>

  <!-- Monocot Bundle Shape -->
  <!-- Phloem (Outer) -->
  <path d="M140,230 C140,190 280,190 280,230 L280,280 L140,280 Z" class="phloem" />
  <!-- Xylem (Inner) -->
  <path d="M140,280 L280,280 L250,420 C240,450 180,450 170,420 Z" class="xylem" />

  <!-- Labels and Arrows for Monocot -->
  <text x="210" y="175" text-anchor="middle" class="label">Phloem</text>
  <line x1="210" y1="185" x2="210" y2="215" class="arrow-line"/>

  <text x="210" y="480" text-anchor="middle" class="label">Xylem</text>
  <line x1="210" y1="455" x2="210" y2="420" class="arrow-line"/>

  <text x="210" y="520" text-anchor="middle" class="sub-header" style="font-size: 14px;">(No Cambium present)</text>


  <!-- Right Side: Conjoint Open Vascular Bundle (Dicot) -->
  <rect x="430" y="50" width="320" height="500" rx="15" ry="15" class="container" />
  <text x="590" y="95" text-anchor="middle" class="header">Conjoint Open Bundle</text>
  <text x="590" y="125" text-anchor="middle" class="sub-header">(Dicot Stem)</text>

  <!-- Dicot Bundle Shape -->
  <!-- Phloem (Outer) -->
  <path d="M520,230 C520,190 660,190 660,230 L660,270 L520,270 Z" class="phloem" />
  <!-- Cambium (Middle) -->
  <rect x="520" y="270" width="140" height="20" class="cambium" />
  <!-- Xylem (Inner) -->
  <path d="M520,290 L660,290 L630,420 C620,450 560,450 550,420 Z" class="xylem" />

  <!-- Labels and Arrows for Dicot -->
  <text x="590" y="175" text-anchor="middle" class="label">Phloem</text>
  <line x1="590" y1="185" x2="590" y2="215" class="arrow-line"/>

  <!-- Cambium Label on the Side -->
  <text x="710" y="285" text-anchor="start" class="label">Cambium</text>
  <line x1="700" y1="280" x2="665" y2="280" class="arrow-line"/>

  <text x="590" y="480" text-anchor="middle" class="label">Xylem</text>
  <line x1="590" y1="455" x2="590" y2="420" class="arrow-line"/>

  <text x="590" y="520" text-anchor="middle" class="sub-header" style="font-size: 14px;">(Capable of secondary growth)</text>

</svg>
